<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Studio 24 identity film, from the brand's own vectors (no redrawn type).

  1. The 24 is one path. Split along its own joint (the edge of the 2's base),
     the 2 arrives down its 45 degree diagonal from the top left and the 4 up
     it from the bottom right, and they lock.
  2. Three colour cuts on the beat.
  3. The 24 shrinks into the badge: the ring letters land one by one as the
     ring turns into place, the dots pop, "Male Grooming" writes on.
  4. The three colourways.
  5. The 24 parts along the same diagonal and leaves, so the film loops.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0d0d0d; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #0d0d0d; }
  .abs { position: absolute; }
  svg { display: block; overflow: visible; }
  .panel { position: absolute; top: 0; bottom: 0; width: 640px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="abs" style="inset:0;background:#0d0d0d"></div>

  <!-- the big 24, split in two -->
  <div id="mark" class="abs" style="left:50%;top:50%;width:465px;height:520px;margin:-260px 0 0 -232px">
    <svg id="m2" viewBox="0 0 68 76" class="abs" style="inset:0;width:100%;height:100%"><defs><clipPath id="c2"><rect x="-1" y="-1" width="46.83" height="63.48"/></clipPath></defs><path class="fill" clip-path="url(#c2)"/></svg>
    <svg id="m4" viewBox="0 0 68 76" class="abs" style="inset:0;width:100%;height:100%"><defs><clipPath id="c4"><path d="M45.83 -1 H70 V78 H-1 V62.48 H45.83 Z"/></clipPath></defs><path class="fill" clip-path="url(#c4)"/></svg>
  </div>

  <!-- the badge, built from the real circle logo -->
  <div id="badge" class="abs" style="left:50%;top:50%;width:588px;height:620px;margin:-310px 0 0 -294px;opacity:0"></div>

  <!-- colourways -->
  <div id="ways" class="abs" style="inset:0;opacity:0">
    <div class="panel" style="left:0;background:#0d0d0d"><img src="circle-white.svg" style="height:360px"></div>
    <div class="panel" style="left:640px;background:#ff671d"><img src="circle-black.svg" style="height:360px"></div>
    <div class="panel" style="left:1280px;background:#0d0d0d"><img src="circle-orange.svg" style="height:360px"></div>
  </div>
</div>
<script src="gsap.min.js"></script>
<script>
const FPS = 30, DURATION = 10;
const tl = gsap.timeline({ paused: true });
const ORANGE = "#ff671d", INK = "#0d0d0d";

window.ready = (async () => {
  const iconD = new DOMParser().parseFromString(await (await fetch("icon.svg")).text(), "image/svg+xml").querySelector("path").getAttribute("d");
  document.querySelectorAll("#mark .fill").forEach((p) => { p.setAttribute("d", iconD); p.setAttribute("fill", ORANGE); });
  document.getElementById("badge").innerHTML = await (await fetch("circle-white.svg")).text();
  const svg = document.querySelector("#badge svg");
  svg.setAttribute("width", "100%"); svg.setAttribute("height", "100%");
  const els = [...svg.querySelectorAll("path,circle")];
  const center = els[0], letters = els.slice(1, 17), script = els.slice(17, 29), dots = els.slice(29);
  // ring rotation pivots on the badge's centre
  const ring = document.createElementNS("http://www.w3.org/2000/svg", "g");
  center.parentNode.insertBefore(ring, letters[0]);
  [...letters, ...dots].forEach((e) => ring.appendChild(e));
  const scriptG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  ring.parentNode.appendChild(scriptG);
  script.forEach((e) => scriptG.appendChild(e));

  const m2 = document.getElementById("m2"), m4 = document.getElementById("m4");
  const mark = document.getElementById("mark"), badge = document.getElementById("badge"), bg = document.getElementById("bg");
  const fills = document.querySelectorAll("#mark .fill");

  /* 1 · lock (0.3 - 1.4) */
  tl.fromTo(m2, { x: -300, y: -300, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 1.0, ease: "expo.out" }, 0.3);
  tl.fromTo(m4, { x: 300, y: 300, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 1.0, ease: "expo.out" }, 0.3);
  tl.fromTo(mark, { scale: 1.04 }, { scale: 1, duration: 0.5, ease: "power2.out" }, 1.1);

  /* 2 · colour cuts on the beat (2.0, 2.5, 3.0) */
  tl.set(bg, { background: ORANGE }, 2.0); tl.set(fills, { attr: { fill: INK } }, 2.0);
  tl.set(bg, { background: "#f4f2ee" }, 2.5); tl.set(fills, { attr: { fill: ORANGE } }, 2.5);
  tl.set(bg, { background: INK }, 3.0); tl.set(fills, { attr: { fill: "#ffffff" } }, 3.0);

  /* 3 · into the badge (3.2 - 6.4)
     The badge's own 24 sits 45.5 x 50.6 of its 108.8 x 114.74 box, centred
     2.77 units above the middle; at 620px tall that is 273px, 15px up. */
  const s = 273 / 520;
  tl.to(mark, { scale: s, y: -15, duration: 0.9, ease: "expo.inOut" }, 3.2);
  tl.set(badge, { opacity: 1 }, 4.1);
  tl.set([...letters, ...dots, ...script], { opacity: 0 }, 0);
  tl.set(center, { opacity: 0 }, 0);
  tl.set(center, { opacity: 1 }, 4.1);
  tl.set(mark, { opacity: 0 }, 4.1);
  tl.fromTo(ring, { rotation: -40, svgOrigin: "54.4 57.37" }, { rotation: 0, svgOrigin: "54.4 57.37", duration: 1.4, ease: "expo.out" }, 4.1);
  letters.forEach((l, k) => tl.fromTo(l, { opacity: 0 }, { opacity: 1, duration: 0.25 }, 4.1 + k * 0.045));
  dots.forEach((d, k) => tl.fromTo(d, { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)" }, 4.85 + k * 0.1));
  script.forEach((e) => tl.set(e, { opacity: 1 }, 4.9));
  tl.fromTo(scriptG, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.9, ease: "power2.inOut" }, 4.9);
  tl.fromTo(badge, { scale: 0.96 }, { scale: 1, duration: 2.2, ease: "none" }, 4.1);

  /* 4 · colourways (6.4 - 8.4) */
  const ways = document.getElementById("ways");
  const panels = ways.querySelectorAll(".panel");
  tl.set(ways, { opacity: 1 }, 6.4);
  panels.forEach((p, k) => tl.fromTo(p, { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 6.4 + k * 0.12));
  tl.set(badge, { opacity: 0 }, 7.2);

  /* 5 · back to the mark, which parts and leaves (8.4 - 10) */
  tl.to(panels, { yPercent: -100, duration: 0.5, ease: "expo.in", stagger: 0.08 }, 8.2);
  tl.set(ways, { opacity: 0 }, 8.9);
  tl.set(mark, { opacity: 1, scale: 1, y: 0 }, 8.75);
  tl.set(fills, { attr: { fill: ORANGE } }, 8.75);
  tl.fromTo([m2, m4], { opacity: 0 }, { opacity: 1, duration: 0.2 }, 8.75);
  tl.to(m2, { x: -300, y: -300, opacity: 0, duration: 0.8, ease: "expo.in" }, 9.2);
  tl.to(m4, { x: 300, y: 300, opacity: 0, duration: 0.8, ease: "expo.in" }, 9.2);
  tl.set({}, {}, DURATION);

  window.renderAt = async (t) => { tl.seek(t, false); return t; };
  renderAt(0);
  return { duration: DURATION, fps: FPS, w: 1920, h: 1080 };
})();
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Star Blinds identity film, from the brand's own vectors.

  The transitions are the product: a venetian blind closes over the frame
  and tilts open on the next scene, so every cut is a blind.

  1. Closed blind tilts open on navy.
  2. The star assembles from its four facets.
  3. It settles into the stacked lockup; STAR and BLINDS rise, ESTD. 1975 tracks in.
  4. Blind closes, opens on paper: the landscape lockup with Star Shutters beneath.
  5. Blind closes, opens on the gold star alone, large, on navy.
  6. Blind closes, which is frame 0 again, so the film loops.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #1e355b; }
  .abs { position: absolute; }
  svg { display: block; overflow: visible; }
  .scene { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #blind { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
  .slat { position: absolute; left: -2%; width: 104%; transform-origin: 50% 50%;
    background: linear-gradient(180deg, #fdfbf7 0%, #f3ede3 45%, #e2d8c7 88%, #c9bca6 100%);
    box-shadow: 0 2px 3px rgba(40, 30, 15, .18); }
  .cord { position: absolute; top: 0; bottom: 0; width: 3px; background: linear-gradient(90deg, #d9cdb7, #efe6d6, #cdbfa6); z-index: 11; }
</style>
</head>
<body>
<div id="s1" class="scene" style="background:#1e355b"><div id="lock" style="width:840px;height:390px"></div></div>
<div id="big" class="abs" style="left:50%;top:50%;width:494px;height:470px;margin:-235px 0 0 -247px;z-index:2;transform-origin:0 0"></div>
<div id="s2" class="scene" style="background:#f5f1ea;opacity:0;flex-direction:column;gap:70px">
  <img src="land-dark.svg" style="width:900px">
  <div style="width:120px;height:3px;background:linear-gradient(90deg,#b17f4a,#cbbba0)"></div>
  <img src="shutters-dark.svg" style="width:640px">
</div>
<div id="s3" class="scene" style="background:#1e355b;opacity:0">
  <img id="bigstar" src="star.svg" style="width:560px">
</div>
<div id="blind"></div>
<script src="gsap.min.js"></script>
<script>
const FPS = 30, DURATION = 10, N = 15;
const tl = gsap.timeline({ paused: true });
const blind = document.getElementById("blind");
const slats = [], cords = [];
for (let i = 0; i < N; i++) {
  const s = document.createElement("div");
  s.className = "slat";
  s.style.top = (i * 1080 / N) + "px";
  s.style.height = (1080 / N + 1.5) + "px";
  blind.appendChild(s); slats.push(s);
}
for (const x of [0.22, 0.78]) {
  const c = document.createElement("div");
  c.className = "cord"; c.style.left = (x * 1920) + "px";
  blind.appendChild(c); cords.push(c);
}
// closed: full height. open: tilted edge-on, a thin dark line, then gone
const OPEN = { scaleY: 0.0, filter: "brightness(0.55)" };
const CLOSED = { scaleY: 1, filter: "brightness(1)" };
function open(at) {
  tl.to(slats, { ...OPEN, duration: 0.7, ease: "power3.inOut", stagger: { each: 0.025, from: "start" } }, at);
  tl.to(cords, { opacity: 0, duration: 0.3 }, at + 0.35);
}
function close(at) {
  tl.to(cords, { opacity: 1, duration: 0.2 }, at);
  tl.fromTo(slats, OPEN, { ...CLOSED, duration: 0.6, ease: "power3.inOut", stagger: { each: 0.025, from: "end" } }, at);
}

window.ready = (async () => {
  const txt = await (await fetch("stacked-light.svg")).text();
  const lock = document.getElementById("lock");
  lock.innerHTML = txt;
  const svg = lock.querySelector("svg");
  svg.setAttribute("width", "100%"); svg.setAttribute("height", "100%");
  const facets = [...svg.querySelectorAll("polygon")];
  const paths = [...svg.querySelectorAll("path")];
  const by = (p) => p.getBBox();
  const star = paths.filter(() => false);
  const words = paths.filter((p) => by(p).y > 60 && by(p).y < 105).sort((a, b) => by(a).x - by(b).x);
  const estd = paths.filter((p) => by(p).y >= 105);
  // the opening star is its own copy of star.svg, big and centred; it then
  // flies onto the lockup's star (measured on screen) and hands over to it
  const big = document.getElementById("big");
  // namespace its classes and gradient ids so they cannot restyle the lockup
  big.innerHTML = (await (await fetch("star.svg")).text()).replace(/cls-/g, "bs-").replace(/linear-gradient/g, "bsg");
  const bsvg = big.querySelector("svg"); bsvg.setAttribute("width", "100%"); bsvg.setAttribute("height", "100%");
  const bigFacets = [...bsvg.querySelectorAll("polygon")];
  const starG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  facets[0].parentNode.insertBefore(starG, facets[0]);
  facets.forEach((f) => starG.appendChild(f));
  const r = starG.getBoundingClientRect(), b0 = big.getBoundingClientRect();
  tl.set(starG, { opacity: 0 }, 0);
  tl.set(blind, { opacity: 1 }, 0);

  /* 1 · blind opens (0.2 - 1.2) */
  open(0.2);
  /* 2 · facets fly in along their own directions (0.5 - 2.0) */
  const sb = bsvg.querySelector("g").getBBox ? { x: 0, y: 0, width: 200.94, height: 191.11 } : null;
  const cx = 100.47, cy = 110;
  bigFacets.forEach((f, k) => {
    const b = f.getBBox(); const fx = b.x + b.width / 2 - cx, fy = b.y + b.height / 2 - cy;
    const d = Math.hypot(fx, fy) || 1;
    tl.fromTo(f, { x: fx / d * 70, y: fy / d * 70, opacity: 0, rotation: (k % 2 ? 16 : -16), svgOrigin: `${cx} ${cy}` },
      { x: 0, y: 0, opacity: 1, rotation: 0, duration: 1.2, ease: "expo.out" }, 0.55 + k * 0.1);
  });
  tl.fromTo(big, { scale: 1.06 }, { scale: 1, duration: 1.6, ease: "power2.out", transformOrigin: "50% 50%" }, 0.55);
  /* 3a · the big star flies onto the lockup's star (2.15 - 3.05) */
  tl.to(big, { x: r.left - b0.left, y: r.top - b0.top, scale: r.width / b0.width, transformOrigin: "0 0", duration: 0.9, ease: "expo.inOut" }, 2.15);
  tl.set(starG, { opacity: 1 }, 3.05);
  tl.set(big, { opacity: 0 }, 3.05);
  /* 3 · settle into the lockup (2.2 - 3.0), words rise (2.6 -), ESTD tracks (3.0 -) */
  words.forEach((w, k) => tl.fromTo(w, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "expo.out" }, 2.6 + k * 0.045));
  estd.forEach((e, k) => tl.fromTo(e, { x: (k - (estd.length - 1) / 2) * -3, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 3.0));
  tl.fromTo("#lock", { scale: 1 }, { scale: 1.03, duration: 2.0, ease: "none" }, 3.0);

  /* 4 · close (4.6), open on paper (5.3) */
  close(4.6);
  tl.set("#s2", { opacity: 1 }, 5.25);
  open(5.3);
  tl.fromTo("#s2", { scale: 1.03 }, { scale: 1, duration: 2.0, ease: "power2.out" }, 5.3);

  /* 5 · close (7.0), open on the star (7.7) */
  close(7.0);
  tl.set("#s3", { opacity: 1 }, 7.65);
  open(7.7);
  tl.fromTo("#bigstar", { scale: 0.92, rotation: -6 }, { scale: 1, rotation: 0, duration: 1.6, ease: "expo.out" }, 7.7);

  /* 6 · close (9.25) back to frame 0 */
  close(9.25);
  tl.set({}, {}, DURATION);

  // frame 0: blind closed over the navy scene
  window.renderAt = async (t) => { tl.seek(t, false); return t; };
  gsap.set(slats, CLOSED);
  renderAt(0);
  return { duration: DURATION, fps: FPS, w: 1920, h: 1080 };
})();
</script>
</body>
</html>

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Cinnamon Spice Heaven identity film, 10s, loops. Built from the brand's own
  vectors. Scenes change on the curved wave from the flyers and window graphics.

  1. The anise star blooms petal by petal on aubergine (0.3 - 1.7).
  2. It settles into the stacked lockup; the wordmark rises in (1.8 - 3.4).
  3. Coral wave: the stamp roundel turns into place (3.6 - 5.4).
  4. Aubergine wave: the landscape lockup over the fascia's star pattern (5.6 - 7.2).
  5. Cream wave: the lockup over the website's category icons (7.4 - 9.0).
  6. Aubergine wave back to an empty ground, which is frame 0 (9.2 - 10).
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #362e48; }
  .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  .wave { position: absolute; left: 0; width: 1920px; height: 1500px; }
  .wave > svg.cap { position: absolute; left: 0; top: -180px; width: 1920px; height: 182px; display: block; }
  .center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  svg { overflow: visible; }
</style>
</head>
<body>
<!-- 1-2 · bloom and lockup -->
<div id="s1" class="scene">
  <div id="lock" class="abs" style="position:absolute;left:50%;top:50%;width:960px;height:362px;margin:-181px 0 0 -480px"></div>
  <div id="bloom" style="position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px 0 0 -260px"></div>
</div>
<!-- 3 · coral, stamp -->
<div id="s2" class="wave" style="top:1260px;background:#dc4238">
  <svg class="cap" viewBox="0 0 1920 182" preserveAspectRatio="none"><path d="M0,182 L0,120 C420,10 900,-20 1920,150 L1920,182 Z" fill="#dc4238"/></svg>
  <div class="center" style="height:1080px"><div id="stamp" style="width:560px;height:560px"></div></div>
</div>
<!-- 4 · aubergine, landscape over the fascia pattern -->
<div id="s3" class="wave" style="top:1260px;background:#362e48">
  <svg class="cap" viewBox="0 0 1920 182" preserveAspectRatio="none"><path d="M0,182 L0,40 C700,170 1300,180 1920,30 L1920,182 Z" fill="#362e48"/></svg>
  <div style="position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden">
    <div id="pattern" style="position:absolute;right:-380px;top:50%;width:1250px;height:1250px;margin-top:-625px;opacity:.3"></div>
  </div>
  <div class="center" style="height:1080px"><img id="landw" src="land-white.svg" style="width:1180px"></div>
</div>
<!-- 5 · cream, lockup over the site's category icons -->
<div id="s4" class="wave" style="top:1260px;background:#f4efe8">
  <svg class="cap" viewBox="0 0 1920 182" preserveAspectRatio="none"><path d="M0,182 L0,140 C500,0 1200,40 1920,110 L1920,182 Z" fill="#f4efe8"/></svg>
  <div class="center" style="height:1080px;flex-direction:column;gap:90px">
    <img id="landp" src="land-purple.svg" style="width:1080px">
    <div id="icons" style="display:flex;gap:70px">
      <img src="icon-vegetables.png" style="width:120px"><img src="icon-cereals.png" style="width:120px"><img src="icon-cookies.png" style="width:120px"><img src="icon-beer.png" style="width:120px"><img src="icon-paper-bag.png" style="width:120px">
    </div>
  </div>
</div>
<!-- 6 · back to the ground -->
<div id="s5" class="wave" style="top:1260px;background:#362e48">
  <svg class="cap" viewBox="0 0 1920 182" preserveAspectRatio="none"><path d="M0,182 L0,120 C420,10 900,-20 1920,150 L1920,182 Z" fill="#362e48"/></svg>
</div>
<script src="gsap.min.js"></script>
<script>
const FPS = 30, DURATION = 10, CORAL = "#dc4238";
const tl = gsap.timeline({ paused: true });
const svgOf = async (url, el, prefix) => {
  el.innerHTML = (await (await fetch(url)).text()).replace(/cls-/g, prefix + "-");
  const s = el.querySelector("svg"); s.setAttribute("width", "100%"); s.setAttribute("height", "100%"); return s;
};
window.ready = (async () => {
  // bloom star: its own copy, coral, petals scale out from the centre
  const bs = await svgOf("anise.svg", document.getElementById("bloom"), "an");
  const petals = [...bs.querySelectorAll("path")];
  petals.forEach((p) => p.style.fill = CORAL);
  // stacked lockup: anise paths are the ones clustered round the star; colour them coral
  const ls = await svgOf("stacked.svg", document.getElementById("lock"), "st");
  const lp = [...ls.querySelectorAll("path")];
  const bb = (p) => p.getBBox();
  // Stacked White: paths 0-18 are the wordmark, 19-26 the anise, 27-36 ASIAN STORE
  const starBox = { set: lp.slice(19, 27) };
  const starPaths = starBox.set;
  starPaths.forEach((p) => p.style.fill = CORAL);
  const rest = lp.filter((p) => !starPaths.includes(p));
  const starG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  starPaths[0].parentNode.insertBefore(starG, starPaths[0]); starPaths.forEach((p) => starG.appendChild(p));
  // screen rects for the hand-over
  const r = starG.getBoundingClientRect(), b0 = document.getElementById("bloom").getBoundingClientRect();

  tl.set(starG, { opacity: 0 }, 0);
  tl.set(rest, { opacity: 0 }, 0);
  /* 1 · bloom */
  petals.forEach((p, k) => {
    const long = k < 4;
    tl.fromTo(p, { scale: 0, opacity: 0, svgOrigin: "49.43 49.43" }, { scale: 1, opacity: 1, duration: 0.9, ease: "back.out(1.6)" }, 0.3 + (long ? 0 : 0.18) + (k % 4) * 0.07);
  });
  tl.fromTo(bs, { rotation: -60 }, { rotation: 0, duration: 1.6, ease: "expo.out", transformOrigin: "50% 50%" }, 0.3);
  /* 2 · into the lockup */
  tl.to("#bloom", { x: (r.left + r.width / 2) - (b0.left + b0.width / 2), y: (r.top + r.height / 2) - (b0.top + b0.height / 2), scale: r.width / b0.width, duration: 0.9, ease: "expo.inOut" }, 1.8);
  tl.set(starG, { opacity: 1 }, 2.7); tl.set("#bloom", { opacity: 0 }, 2.7);
  const sorted = rest.slice().sort((a, z) => bb(a).x - bb(z).x);
  sorted.forEach((p, k) => tl.fromTo(p, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "expo.out" }, 2.25 + k * 0.022));
  tl.fromTo("#lock", { scale: 0.98 }, { scale: 1.02, duration: 2.0, ease: "none" }, 2.4);

  /* waves: each scene rises from below on its curved edge */
  const rise = (id, at) => tl.fromTo(id, { y: 0 }, { y: -1260, duration: 0.85, ease: "power3.inOut" }, at);
  /* 3 · coral + stamp */
  rise("#s2", 3.6);
  const ss = await svgOf("stamp.svg", document.getElementById("stamp"), "sp");
  const sp = [...ss.querySelectorAll("path")];
  // ring letters vs the inner anise: inner paths are near the centre
  const inner = sp.filter((p) => { const b = bb(p); return Math.hypot(b.x + b.width / 2 - 75.8, b.y + b.height / 2 - 75.8) < 30; });
  const ring = sp.filter((p) => !inner.includes(p));
  const ringG = document.createElementNS("http://www.w3.org/2000/svg", "g");
  ring[0].parentNode.insertBefore(ringG, ring[0]); ring.forEach((p) => ringG.appendChild(p));
  tl.fromTo(ringG, { rotation: -90, opacity: 0, svgOrigin: "75.8 75.8" }, { rotation: 0, opacity: 1, duration: 1.4, ease: "expo.out" }, 4.1);
  inner.forEach((p, k) => tl.fromTo(p, { scale: 0, svgOrigin: "75.8 75.8" }, { scale: 1, duration: 0.7, ease: "back.out(1.8)" }, 4.3 + k * 0.04));
  /* 4 · aubergine + landscape over the pattern */
  rise("#s3", 5.6);
  const pt = await svgOf("anise.svg", document.getElementById("pattern"), "pt");
  pt.querySelectorAll("path").forEach((p) => p.style.fill = CORAL);
  tl.fromTo("#pattern", { rotation: -20, scale: 0.9 }, { rotation: 0, scale: 1, duration: 1.8, ease: "power2.out" }, 5.8);
  tl.fromTo("#landw", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 6.15);
  /* 5 · cream + icons */
  rise("#s4", 7.4);
  tl.fromTo("#landp", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 7.95);
  tl.fromTo("#icons img", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out", stagger: 0.08 }, 8.2);
  /* 6 · back to the ground */
  rise("#s5", 9.15);
  tl.set({}, {}, DURATION);
  window.renderAt = async (t) => { tl.seek(t, false); return t; };
  await renderAt(0);
  return { duration: DURATION, fps: FPS, w: 1920, h: 1080 };
})();
</script>
</body>
</html>

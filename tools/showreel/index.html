<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Nexa showreel. A paused GSAP timeline, seeked frame by frame by render.mjs.

  Everything is on the score's grid: 120 BPM, a beat every 0.5s, a bar every
  2s, 21 bars. Every cut lands on a beat or an 8th note, and each project gets
  exactly four bars, so the music (music.py) and the picture change together.

  Text rule: words and titles only ever sit over shots with no type or logo
  in them (the portrait, the glass, the kitchens, a clean fitting room). Shots
  that carry a logo or a website play with nothing on top.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; background: #000; overflow: hidden; }
  body { font-family: "DM Sans", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: #000; }
  .layer { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
  .layer img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .dim::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0.42); }
  .word { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
          font-size: 200px; font-weight: 500; letter-spacing: -0.055em; line-height: 1; visibility: hidden; }
  .title { position: absolute; left: 104px; bottom: 104px; visibility: hidden; }
  .title .idx { font-size: 18px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.72); overflow: hidden; }
  .title .name { font-size: 64px; font-weight: 400; letter-spacing: -0.04em; line-height: 1.02; margin-top: 12px; overflow: hidden; padding-bottom: 6px; }
  .title span { display: inline-block; }
  .shade { position: absolute; inset: 0; background: linear-gradient(to top right, rgba(0,0,0,0.55), rgba(0,0,0,0) 50%); }
  .bar { position: absolute; top: 0; bottom: 0; background: #000; }
  .red { background: #ef4136; }
  .card { position: absolute; overflow: hidden; border-radius: 22px; }
  .card img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="gsap.min.js"></script>
<script>
const FPS = 30, DURATION = 42;
const stage = document.getElementById("stage");
const tl = gsap.timeline({ paused: true });
const seqLayers = [];
let counts = {};

const LOGO = `<svg viewBox="0 0 271.6 72.45" style="width:100%;height:100%"><path fill="#ef4136" d="M0,0V72.45H72.46V0ZM29,58H14.49V14.49L29,29Zm29,0h0L43.47,43.47v-29H58Z"/><g class="letters" fill="#fff"><polygon points="127.28 17.93 127.28 40.19 108.61 17.94 108.61 17.93 101.57 17.93 101.57 51.14 108.61 51.14 108.61 28.88 127.28 51.13 127.28 51.14 134.32 51.14 134.32 17.93 127.28 17.93"/><polygon points="226.8 17.93 217.61 17.93 217.61 17.94 208.27 29.07 198.94 17.94 198.94 17.93 189.75 17.93 203.68 34.54 189.75 51.14 198.94 51.14 198.94 51.13 208.27 40.01 217.61 51.13 217.61 51.14 226.8 51.14 212.87 34.54 226.8 17.93"/><polygon points="176.38 24.97 176.38 17.93 155.91 17.93 151.22 17.93 148.87 17.93 148.87 51.14 151.22 51.14 155.91 51.14 176.38 51.14 176.38 44.1 155.91 44.1 155.91 38.06 176.38 38.06 176.38 31.02 155.91 31.02 155.91 24.97 176.38 24.97"/><path d="M256.11,17.93H248L232.52,51.14h7.77l3.09-6.62h17.36l3.09,6.62h7.77Zm-9.45,19.55,5.4-11.58,5.4,11.58Z"/></g></svg>`;

function el(html, parent = stage) {
  const t = document.createElement("template"); t.innerHTML = html.trim();
  const n = t.content.firstChild; parent.appendChild(n); return n;
}
function span(node, a, b) {
  tl.set(node, { visibility: "visible" }, a);
  tl.set(node, { visibility: "hidden" }, b);
}
function seq(id, a, b, { dim = false, z = 1 } = {}) {
  const n = el(`<div class="layer${dim ? " dim" : ""}" style="z-index:${z}"><img></div>`);
  seqLayers.push({ img: n.querySelector("img"), id, start: a, node: n });
  span(n, a, b); return n;
}
function still(file, a, b, { z = 1, dim = false } = {}) {
  const n = el(`<div class="layer${dim ? " dim" : ""}" style="z-index:${z}"><img src="img/${file}"></div>`);
  span(n, a, b); return n;
}
// Small title, only ever over a clean shot
function title(idx, name, a, b) {
  const n = el(`<div class="title" style="z-index:40"><div class="idx"><span>${idx}</span></div><div class="name"><span>${name}</span></div></div>`);
  const shade = el(`<div class="shade" style="z-index:39;visibility:hidden"></div>`);
  span(n, a, b); span(shade, a, b);
  const [i, nm] = n.querySelectorAll("span");
  tl.fromTo(shade, { opacity: 0 }, { opacity: 1, duration: 0.5 }, a);
  tl.fromTo(i, { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, a);
  tl.fromTo(nm, { yPercent: 110 }, { yPercent: 0, duration: 0.8, ease: "expo.out" }, a + 0.08);
  tl.to([nm, i], { yPercent: -110, duration: 0.35, ease: "expo.in", stagger: 0.04 }, b - 0.4);
  tl.to(shade, { opacity: 0, duration: 0.35 }, b - 0.35);
}
function push(n, a, b, from = 1.0, to = 1.08) {
  tl.fromTo(n.querySelector("img") || n, { scale: from }, { scale: to, duration: b - a, ease: "none" }, a);
}
function word(text, a, b) {
  const n = el(`<div class="word" style="z-index:30">${text}</div>`);
  span(n, a, b);
  tl.fromTo(n, { scale: 1.12, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "expo.out" }, a);
}
function flashes(files, a, step) {
  files.forEach((f, k) => {
    const n = still(f, a + k * step, a + (k + 1) * step);
    push(n, a + k * step, a + (k + 1) * step, 1.06, 1.0);
  });
}

/* ── Bar 0-1 · open (0-4) ──────────────────────────────────────────── */
const logo = el(`<div style="position:absolute;left:50%;top:50%;width:700px;height:187px;margin:-93px 0 0 -350px;z-index:20;visibility:hidden">${LOGO}</div>`);
span(logo, 0.5, 2.0);
tl.fromTo(logo, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "expo.out" }, 0.5);   // beat 1
tl.fromTo(logo.querySelector(".letters"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "expo.inOut" }, 1.0); // beat 2
tl.to(logo, { scale: 1.6, opacity: 0, duration: 0.45, ease: "expo.in" }, 1.55);                                // out on the riser

// Words over clean footage only, one per beat
const k2 = still("gk-kitchen-2.jpg", 2.0, 2.5, { dim: true }); push(k2, 2.0, 2.5, 1.12, 1.0); word("Brand.", 2.0, 2.5);
seq("w2", 2.5, 3.0, { dim: true }); word("Digital.", 2.5, 3.0);
seq("w3", 3.0, 3.5, { dim: true }); word("Motion.", 3.0, 3.5);
const redA = el(`<div class="layer red" style="z-index:2"></div>`); span(redA, 3.5, 4.0);
const nd = el(`<div class="word" style="z-index:30;font-size:110px">Nexa Creative</div>`); span(nd, 3.5, 4.0);
tl.fromTo(nd, { letterSpacing: "0.02em", opacity: 0 }, { letterSpacing: "-0.05em", opacity: 1, duration: 0.4, ease: "expo.out" }, 3.5);

/* ── Bars 2-5 · WhatsExposed (4-12) ─────────────────────────────────── */
const weh = seq("weh", 4.0, 6.3); push(weh, 4.0, 6.3, 1.06, 1.0);
title("01 / Cybersecurity", "WhatsExposed", 4.0, 5.8);
// slice wipe on the bar line at 6.0, into the logo (nothing over it)
const we3d = seq("we3d", 6.0, 8.0); push(we3d, 6.0, 8.0, 1.0, 1.08);
for (let k = 0; k < 5; k++) {
  const b = el(`<div class="bar" style="left:${k * 384}px;width:386px;z-index:35;visibility:hidden"></div>`);
  span(b, 5.75, 6.4);
  tl.fromTo(b, { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.22, ease: "expo.in" }, 5.75 + k * 0.006);
  tl.to(b, { scaleY: 0, transformOrigin: "50% 0%", duration: 0.32, ease: "expo.out" }, 6.0 + k * 0.02);
}
// three-up on 8ths
["we-billboard.jpg", "we-social.jpg", "we-lanyard.jpg"].forEach((f, k) => {
  const n = el(`<div class="layer" style="left:${k * 640}px;width:640px;right:auto;z-index:5"><img src="img/${f}"></div>`);
  span(n, 8.0 + k * 0.25, 9.0);
  tl.fromTo(n, { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.35, ease: "expo.out" }, 8.0 + k * 0.25);
  push(n, 8.0, 9.0, 1.12, 1.0);
});
const wew = seq("wew", 9.0, 12.2); push(wew, 9.0, 12.2, 1.0, 1.08);
const sweep = el(`<div class="layer red" style="z-index:36"></div>`); span(sweep, 11.6, 12.45);
tl.fromTo(sweep, { xPercent: -100 }, { xPercent: 0, duration: 0.4, ease: "expo.in" }, 11.6);   // lands on 12.0
tl.to(sweep, { xPercent: 100, duration: 0.45, ease: "expo.out" }, 12.0);

/* ── Bars 6-9 · Quinn IT (12-20) ─────────────────────────────────────── */
const qb = still("qi-blocks.jpg", 12.0, 14.0); push(qb, 12.0, 14.0, 1.0, 1.08);
title("02 / Technology", "Quinn IT", 12.25, 13.8);
const qia = seq("qia", 14.0, 15.0); push(qia, 14.0, 15.0, 1.04, 1.0);
const qil = seq("qil", 15.0, 17.0);
tl.fromTo(qil.querySelector("img"), { scale: 1.18 }, { scale: 1.0, duration: 0.6, ease: "expo.out" }, 15.0);
flashes(["qi-van-1.jpg", "qi-cards.jpg", "qi-wallsign.jpg", "qi-tshirt.jpg"], 17.0, 0.25);
const qiw = seq("qiw", 18.0, 20.0); push(qiw, 18.0, 20.0, 1.0, 1.06);
tl.fromTo(qiw, { clipPath: "circle(80% at 50% 50%)" }, { clipPath: "circle(0% at 50% 50%)", duration: 0.45, ease: "expo.in" }, 19.55);

/* ── Bars 10-13 · Gallagher Kitchens (20-28) ─────────────────────────── */
const k1 = still("gk-kitchen-1.jpg", 20.0, 22.0); push(k1, 20.0, 22.0, 1.0, 1.08);
tl.fromTo(k1, { clipPath: "circle(0% at 50% 50%)" }, { clipPath: "circle(80% at 50% 50%)", duration: 0.6, ease: "expo.out" }, 20.0);
title("03 / Interiors", "Gallagher Kitchens", 20.25, 21.8);
const gk3 = seq("gk3", 22.0, 24.0);
tl.fromTo(gk3.querySelector("img"), { scale: 1.12 }, { scale: 1.0, duration: 0.7, ease: "expo.out" }, 22.0);
const k3 = still("gk-kitchen-3.jpg", 24.0, 25.0, { z: 2 }); push(k3, 24.0, 25.0, 1.06, 1.0);
tl.fromTo(k3, { xPercent: 100 }, { xPercent: 0, duration: 0.4, ease: "expo.out" }, 24.0);
const vl = el(`<div class="layer" style="width:960px;right:auto;z-index:3"><img src="img/gk-vans.jpg"></div>`); span(vl, 25.0, 26.0);
const vr = el(`<div class="layer" style="left:960px;width:960px;right:auto;z-index:3"><img src="img/gk-cards-desk.jpg"></div>`); span(vr, 25.0, 26.0);
tl.fromTo(vl, { yPercent: -100 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, 25.0);
tl.fromTo(vr, { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: "expo.out" }, 25.0);
const gkw = seq("gkw", 26.0, 28.0); push(gkw, 26.0, 28.0, 1.0, 1.06);
tl.to(gkw, { clipPath: "inset(0 0 100% 0)", duration: 0.4, ease: "expo.in" }, 27.6);

/* ── Bars 14-17 · Collar & Cuff (28-36) ──────────────────────────────── */
const ccc = still("cc-clean.jpg", 28.0, 30.0); push(ccc, 28.0, 30.0, 1.04, 1.0);
tl.fromTo(ccc, { clipPath: "inset(100% 0 0 0)" }, { clipPath: "inset(0% 0 0 0)", duration: 0.45, ease: "expo.out" }, 28.0);
title("04 / Menswear", "Collar &amp; Cuff", 28.25, 29.8);
const ccl = seq("ccl", 30.0, 32.0); push(ccl, 30.0, 32.0, 1.04, 1.0);
const ccp = seq("ccp", 32.0, 33.0); push(ccp, 32.0, 33.0, 1.0, 1.05);
flashes(["cc-shopfront.jpg", "cc-swing-tag.jpg", "cc-woven-label.jpg", "cc-stadium.jpg", "cc-carrier-bag.jpg", "cc-box.jpg"], 33.0, 0.25);
const cct = seq("cct", 34.5, 36.2); push(cct, 34.5, 36.2, 1.0, 1.06);

/* ── Bars 18-20 · outro (36-42) ──────────────────────────────────────── */
const grid = el(`<div class="layer" style="z-index:10"></div>`); span(grid, 36.0, 38.4);
const W = 860, H = 484, G = 28, X0 = (1920 - W * 2 - G) / 2, Y0 = (1080 - H * 2 - G) / 2;
["o1", "o2", "o3", "o4"].forEach((id, k) => {
  const c = el(`<div class="card" style="left:${X0 + (k % 2) * (W + G)}px;top:${Y0 + Math.floor(k / 2) * (H + G)}px;width:${W}px;height:${H}px"><img></div>`, grid);
  seqLayers.push({ img: c.querySelector("img"), id, start: 36.0, node: grid });
  tl.fromTo(c, { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, 36.0 + k * 0.25);  // on 8ths
});
tl.to(cct, { scale: 0.5, opacity: 0, duration: 0.35, ease: "expo.in" }, 35.85);
tl.to(grid, { scale: 0.82, opacity: 0, duration: 0.4, ease: "expo.in" }, 37.6);
const end = el(`<div style="position:absolute;inset:0;z-index:20;visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center">
  <div class="endlogo" style="width:520px;height:139px">${LOGO}</div>
  <div class="tag" style="margin-top:42px;font-size:30px;letter-spacing:-0.02em;color:rgba(255,255,255,0.85)">Brand and digital design that earns attention.</div>
  <div class="url" style="margin-top:18px;font-size:18px;letter-spacing:0.16em;text-transform:uppercase;color:rgba(255,255,255,0.45)">nexacreative.ie</div></div>`);
span(end, 38.0, DURATION + 1);
tl.fromTo(end.querySelector(".endlogo"), { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.9, ease: "expo.out" }, 38.0);  // the final hit
tl.fromTo(end.querySelector(".tag"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 38.5);
tl.fromTo(end.querySelector(".url"), { y: 10, opacity: 0 }, { y: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 39.0);
tl.to(end, { opacity: 0, duration: 0.8, ease: "power2.in" }, 41.2);

tl.set({}, {}, DURATION);

window.renderAt = async (t) => {
  tl.seek(t, false);
  const waits = [];
  for (const L of seqLayers) {
    if (getComputedStyle(L.node).visibility !== "visible") continue;
    const n = Math.max(1, Math.min(counts[L.id], Math.floor((t - L.start) * FPS) + 1));
    const src = `seq/${L.id}/f${String(n).padStart(4, "0")}.jpg`;
    if (!L.img.getAttribute("src") || !L.img.getAttribute("src").endsWith(src)) L.img.src = src;
  }
  for (const img of document.images) if (img.getAttribute("src")) waits.push(img.decode().catch(() => {}));
  await Promise.all(waits);
  return t;
};
window.ready = (async () => {
  counts = await (await fetch("counts.json")).json();
  await document.fonts.ready;
  await renderAt(0);
  return { duration: DURATION, fps: FPS };
})();
</script>
</body>
</html>
